name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Keep temporary files inside ignored output
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.local/agent/tmp/ci"
          for variable in TMPDIR TMP TEMP; do
            echo "$variable=$GITHUB_WORKSPACE/.local/agent/tmp/ci" >> "$GITHUB_ENV"
          done
      - name: Repository preflight
        run: python3 -B tools/check_repository.py
      - name: Embedded translations
        run: |
          python3 -B tools/i18n/generate.py --check
          python3 -B -m unittest discover -s tools/i18n -p 'test_*.py' -v
      - name: Text package integrity
        run: python3 -B -m unittest discover -s tools/text-build -p 'test_text_pack.py' -v

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qtbase5-dev qtmultimedia5-dev libx11-dev libxext-dev xvfb xauth x11-utils openbox xdotool
      - name: Keep build and temporary files inside ignored output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.local/agent/tmp/ci"
          for variable in TMPDIR TMP TEMP; do
            echo "$variable=$GITHUB_WORKSPACE/.local/agent/tmp/ci" >> "$GITHUB_ENV"
          done
      - name: Build Linux application and tests
        run: |
          cmake -S apps/linux -B .local/linux-build -DCMAKE_BUILD_TYPE=Release -DWPSCLOCK_X11_TESTS=ON
          cmake --build .local/linux-build --parallel 2
      - name: Run model, configuration and isolated X11 tests
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash -euo pipefail -c '
            openbox --sm-disable > "$TMPDIR/openbox.log" 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            ready=false
            for attempt in $(seq 1 50); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
                ready=true
                break
              fi
              sleep 0.1
            done
            if [ "$ready" != true ]; then cat "$TMPDIR/openbox.log"; exit 1; fi
            ctest --test-dir .local/linux-build --output-on-failure || { cat "$TMPDIR/openbox.log"; exit 1; }
            ctest --test-dir .local/linux-build -R "^x11$" --repeat until-fail:5 --output-on-failure || { cat "$TMPDIR/openbox.log"; exit 1; }
          '
      - name: Verify portable packaging
        run: python3 -B tools/linux/package.py --binary .local/linux-build/WpsClock --out .local/agent/packages/linux-ci

  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Keep temporary files inside ignored output
        shell: pwsh
        run: |
          $temporary = Join-Path $env:GITHUB_WORKSPACE '.local/agent/tmp/ci'
          New-Item -ItemType Directory -Force -Path $temporary | Out-Null
          foreach ($variable in @('TMPDIR', 'TMP', 'TEMP')) {
            "$variable=$temporary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build Windows application
        shell: cmd
        run: call apps\windows\Build.cmd
      - name: Windows logic regression
        shell: cmd
        run: call tests\windows\RunTests.cmd
      - name: Chinese and English settings layout
        shell: cmd
        run: call tests\windows\RunLayoutChecks.cmd
      - name: PowerShell bootstrap validation
        shell: pwsh
        run: python -B tools/text-build/test_bootstrap.py
